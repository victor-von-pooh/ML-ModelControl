[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-modelcontrol"
version = "0.1.0"
description = "PyTorch のモデルの部品を登録簿として持ち, 部品をつないだ定義からモデルを組み立てるライブラリ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "torch>=2.2"
]

[project.optional-dependencies]
geometric = [
    "torch_geometric>=2.4"
]
huggingface = [
    "transformers>=4.40"
]
torchvision = [
    "torchvision>=0.18"
]
timm = [
    "timm>=1.0"
]
torchaudio = [
    "torchaudio>=2.3"
]
einops = [
    "einops>=0.8"
]
kornia = [
    "kornia>=0.7"
]
monai = [
    "monai>=1.3"
]
smp = [
    "segmentation-models-pytorch>=0.3"
]
all = [
    "ml-modelcontrol[geometric,huggingface,torchvision,timm,torchaudio,einops,kornia,monai,smp]"
]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

# 同梱する例のモデルの定義
[tool.setuptools.package-data]
ml_modelcontrol = ["examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

format_version: 1
name: two_tower_retrieval
description: >-
  推薦と検索の 2 塔のモデル: 利用者と品物を別の塔で L2 正規化した埋め込みにし,
  バッチの中の全ての組の内積を温度で割って点数の表にする
  (対角が, 対になった利用者と品物の点数).
  学習の step で対角を正解とする交差エントロピー (バッチの中の他の品物が負例)
  を計算する
inputs:
  user: {shape: [8, 12], ui: {x: 0, y: 60}}
  item: {shape: [8, 20], ui: {x: 0, y: 300}}
nodes:
  # 利用者の塔 (12 → 32 → 16 → 正規化)
  user_fc1:
    unit: nn.Linear
    params: {in_features: 12, out_features: 32}
    inputs: user
    ui: {x: 220, y: 60}
  user_act:
    unit: nn.ReLU
    inputs: user_fc1
    ui: {x: 470, y: 60}
  user_fc2:
    unit: nn.Linear
    params: {in_features: 32, out_features: 16}
    inputs: user_act
    ui: {x: 720, y: 60}
  user_emb:
    unit: op.L2Normalize
    inputs: user_fc2
    ui: {x: 970, y: 60}
  # 品物の塔 (20 → 32 → 16 → 正規化)
  item_fc1:
    unit: nn.Linear
    params: {in_features: 20, out_features: 32}
    inputs: item
    ui: {x: 220, y: 300}
  item_act:
    unit: nn.ReLU
    inputs: item_fc1
    ui: {x: 470, y: 300}
  item_fc2:
    unit: nn.Linear
    params: {in_features: 32, out_features: 16}
    inputs: item_act
    ui: {x: 720, y: 300}
  item_emb:
    unit: op.L2Normalize
    inputs: item_fc2
    ui: {x: 970, y: 300}
  # 点数の表 (利用者の埋め込みと品物の埋め込みの転置の行列の積.
  # (8, 16) と (16, 8) から (8, 8). 対角が組ごとの内積)
  item_t:
    unit: op.Transpose
    params: {dim0: 0, dim1: 1}
    inputs: item_emb
    ui: {x: 1220, y: 300}
  dot:
    unit: op.MatMul
    inputs: {input: user_emb, other: item_t}
    ui: {x: 1470, y: 180}
  # 温度 0.05 での割り算 (20 倍. 正規化した内積は -1 から 1 で,
  # そのままでは交差エントロピーの勾配が弱いため)
  score:
    unit: op.Scale
    params: {factor: 20.0}
    inputs: dot
    ui: {x: 1720, y: 180}
outputs:
  score: score
  user_embedding: user_emb
  item_embedding: item_emb
ui:
  outputs:
    score: {x: 1970, y: 180}
    user_embedding: {x: 1970, y: 40}
    item_embedding: {x: 1970, y: 320}

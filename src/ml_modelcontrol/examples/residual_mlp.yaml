format_version: 1
name: residual_mlp
description: 残差のつなぎ方を持つ全結合のモデル (入力と変換の結果を足す)
inputs:
  x: {shape: [8, 16], ui: {x: 0, y: 160}}
nodes:
  fc1:
    unit: nn.Linear
    params: {in_features: 16, out_features: 16}
    inputs: x
    ui: {x: 220, y: 60}
  act:
    unit: nn.GELU
    inputs: fc1
    ui: {x: 470, y: 60}
  add:
    unit: op.Add
    inputs: {xs: [x, act]}
    ui: {x: 720, y: 160}
  norm:
    unit: nn.LayerNorm
    params: {normalized_shape: 16}
    inputs: add
    ui: {x: 970, y: 160}
  head:
    unit: nn.Linear
    params: {in_features: 16, out_features: 3}
    inputs: norm
    ui: {x: 1220, y: 160}
outputs:
  logits: head
ui:
  outputs:
    logits: {x: 1470, y: 180}

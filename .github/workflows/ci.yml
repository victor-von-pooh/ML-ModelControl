name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 任意の依存を入れない場合と, 全て入れた場合
          - python-version: "3.10"
            extras: dev
            torch: torch
          - python-version: "3.13"
            extras: dev,all
            torch: torch torchvision torchaudio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CUDA の無い軽い PyTorch を先に入れてから, パッケージとテストの依存を入れる
      - run: pip install ${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest -q

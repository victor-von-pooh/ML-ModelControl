name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 任意の依存を入れない場合と, 全て入れた場合
          - python-version: "3.10"
            extras: dev
            torch: torch
          - python-version: "3.13"
            extras: dev,all
            torch: torch torchvision torchaudio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CUDA の無い軽い PyTorch を先に入れてから, パッケージとテストの依存を入れる
      - run: pip install ${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest -q
      # 1 行 79 文字以内 (CODING_STYLE.md. 日本語も 1 文字と数える)
      - name: 行の長さの確認
        run: |
          python - <<'EOF'
          import pathlib
          import sys

          long = [
              f"{path}:{number}"
              for path in sorted(pathlib.Path(".").glob("[st]*/**/*.py"))
              for number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), 1
              )
              if len(line) > 79
          ]
          print("\n".join(long))
          sys.exit(1 if long else 0)
          EOF

  # CLAUDE.md の一覧に無いリポジトリの名前が, 管理下のファイルに無いことの確認
  repo-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_repo_names.py
